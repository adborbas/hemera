name: 1 · Cut Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to cut (defaults to the next release number)'
        required: false

permissions:
  contents: write

jobs:
  cut:
    name: Cut Release Branch
    runs-on: macos-15
    if: github.actor == 'adborbas'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Cut release
        run: bundle exec fastlane cut_release version:"${{ inputs.version }}"
